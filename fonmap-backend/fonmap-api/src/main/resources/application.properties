spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/fonmap_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fonmap_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:fonmap_password}

# Flyway Otomatik Veritabani Semasi ve Tohum Veri Yonetimi
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JPA & Hibernate Ayarlari
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
logging.level.com.fonmap=DEBUG

# Batch Insert (Toplu Ekleme) Ayarlari
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# =======================================================
# REDIS ONBELLEK AYARLARI
# =======================================================
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:${SPRING_REDIS_HOST:localhost}}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:${SPRING_REDIS_PORT:6379}}
spring.data.redis.timeout=2000ms

# =======================================================
# RESILIENCE4J (DAYANIKLILIK VE SIGORTA) AYARLARI
# =======================================================
# 1. Circuit Breaker (Sigorta / Devre Kesici)
# Son 10 çağrıda hata oranı %50'yi aşarsa sigorta 'OPEN' (Açık) olur ve 10 saniye bekler.
resilience4j.circuitbreaker.instances.priceService.sliding-window-size=10
resilience4j.circuitbreaker.instances.priceService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.priceService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.priceService.wait-duration-in-open-state=10000ms
resilience4j.circuitbreaker.instances.priceService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.priceService.automatic-transition-from-open-to-half-open-enabled=true

# 2. Retry (Yeniden Deneme)
# Anlık ağ kopmalarında 500ms aralıkla en fazla 3 kez tekrar dener (üstel artışla: 500ms, 1000ms...)
resilience4j.retry.instances.priceService.max-attempts=3
resilience4j.retry.instances.priceService.wait-duration=500ms
resilience4j.retry.instances.priceService.enable-exponential-backoff=true
resilience4j.retry.instances.priceService.exponential-backoff-multiplier=2

# 3. priceProvider Alias (PriceService içindeki @CircuitBreaker(name="priceProvider") için)
resilience4j.circuitbreaker.instances.priceProvider.sliding-window-size=10
resilience4j.circuitbreaker.instances.priceProvider.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.priceProvider.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.priceProvider.wait-duration-in-open-state=10000ms
resilience4j.circuitbreaker.instances.priceProvider.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.priceProvider.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.retry.instances.priceProvider.max-attempts=3
resilience4j.retry.instances.priceProvider.wait-duration=500ms
resilience4j.retry.instances.priceProvider.enable-exponential-backoff=true
resilience4j.retry.instances.priceProvider.exponential-backoff-multiplier=2

# =======================================================
# DOSYA YÜKLEME (MULTIPART UPLOAD) AYARLARI
# =======================================================
# 4.3 MB ve üzeri büyük KAP fon portföy dağılım PDF'leri için limit 25 MB'a çıkarılmıştır.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# =======================================================
# ACTUATOR & PROMETHEUS METRIKLERI (GRAFANA ENTEGRASYONU)
# =======================================================
# Yalnızca sağlık ve Prometheus açık; detay/metrics/info yetkisiz erişime kapalı.
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.prometheus.enabled=true

# =======================================================
# MAKROEKONOMIK GOSTERGELER & RESMI FAIZ ORANI
# =======================================================
# TCMB 1 Hafta Vadeli Repo Ihale / Politika Faizi (Varsayilan: %37 -> 0.370000)
fonmap.macro.policy-rate=${FONMAP_POLICY_RATE:0.370000}

