version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fonmap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fonmap_db
      POSTGRES_USER: fonmap_user
      POSTGRES_PASSWORD: fonmap_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fonmap_user -d fonmap_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fonmap-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./fonmap-backend
      dockerfile: Dockerfile
    container_name: fonmap-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/fonmap_db
      - SPRING_DATASOURCE_USERNAME=fonmap_user
      - SPRING_DATASOURCE_PASSWORD=fonmap_password
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
